<!DOCTYPE html>

    <!-- ============ Navigation (present on every page) ============ -->

        <div class="container nav-wrap">
            <a class="brand" href="index.html">
                <span class="brand-heart">&#10084;</span> HeartsUnited

                <a href="index.html">Home</a>
